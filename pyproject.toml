[project]
name = "autobuild-factory"
version = "0.9.3"
description = "The software factory's build cycle, harness-neutral: logic once, mechanisms behind adapters."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Georgios Antikatzidis" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sdk = ["claude-agent-sdk>=0.2.168,<0.2.169"]

[project.urls]
Repository = "https://github.com/antikas/autobuild-factory"
Issues = "https://github.com/antikas/autobuild-factory/issues"

[project.scripts]
autobuild = "autobuild.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-xdist==3.8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autobuild"]
