[project]
name = "autobuild"
version = "0.2.2"
description = "The software factory's build cycle, harness-neutral: logic once, mechanisms behind adapters."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Georgios Antikatzidis" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/antikas/autobuild"
Issues = "https://github.com/antikas/autobuild/issues"

[project.scripts]
autobuild = "autobuild.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autobuild"]
